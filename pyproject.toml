[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-radar"
version = "0.1.0"
description = "A daily arXiv digest ranked against your research interests, with LLM-written summaries."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "anthropic>=2.5,<3",
    "openai>=3.49,<4",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arxiv-radar = "arxiv_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arxiv_radar = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
