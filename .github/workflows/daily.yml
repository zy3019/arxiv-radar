name: Daily radar

on:
  schedule:
    # arXiv announces new papers around 01:00 UTC, Monday to Friday.
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write # commit data/ back to the repository
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install .

      - id: pages
        uses: actions/configure-pages@v6

      - name: Fetch, rank, summarize and build the site
        run: arxiv-radar run
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RADAR_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Commit the new digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: digest for $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
